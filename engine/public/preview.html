<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeliks assistant styles</title>
<style>
  body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef0f2;color:#1d1d1f}
  body.dark{background:#0b0b0c;color:#f5f5f7}
  main{max-width:760px;padding:56px 32px}
  h1{font-size:40px;line-height:1.1;letter-spacing:-.02em;margin:0 0 12px}
  p{color:#6e6e73;margin:0 0 28px;max-width:520px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .opts a{padding:10px 16px;border-radius:12px;background:#fff;color:inherit;text-decoration:none;font-weight:500;border:1px solid rgba(0,0,0,.08)}
  body.dark .opts a{background:#1c1c1f;border-color:rgba(255,255,255,.1)}
  .opts a.on{background:#0f5c63;color:#fff;border-color:#0f5c63}
</style>
</head>
<body>
<main>
  <h1>Ask the Zeliks assistant anything</h1>
  <p>Pick a style, then try it in English or Arabic. On a phone, each style opens the way an iOS app would.</p>
  <div class="opts" id="v"></div>
  <div class="opts" id="t"></div>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || 'studio', t = q.get('t') || 'light';
  if (t === 'dark') document.body.className = 'dark';
  function opts(id, list, cur, key) {
    document.getElementById(id).innerHTML = list.map(function (x) {
      var p = new URLSearchParams(location.search); p.set(key, x[0]);
      return '<a class="' + (x[0] === cur ? 'on' : '') + '" href="?' + p + '">' + x[1] + '</a>';
    }).join('');
  }
  opts('v', [['studio','Studio'],['classic','Classic'],['soft','Soft'],['noir','Noir'],['editorial','Editorial']], v, 'v');
  opts('t', [['light','Light'],['dark','Dark']], t, 't');
  var s = document.createElement('script');
  s.src = 'widget.js'; s.async = true;
  s.setAttribute('data-zeliks-key', q.get('key') || '');
  s.setAttribute('data-variant', v); s.setAttribute('data-theme', t); s.setAttribute('data-open', 'true');
  document.body.appendChild(s);
</script>
</body>
</html>
